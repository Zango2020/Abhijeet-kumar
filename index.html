    <meta name="theme-color" content="#06b6d4" />

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom scrollbar for webkit browsers */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(31, 41, 55, 0.5);
        border-radius: 3px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #06b6d4, #a855f7);
        border-radius: 3px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #22d3ee, #c084fc);
      }

      /* SVG element highlighting */
      .svg-highlight {
        filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.8)) drop-shadow(0 0 20px rgba(168, 85, 247, 0.4));
        transition: filter 0.3s ease-in-out, transform 0.2s ease-out;
        transform: scale(1.02);
      }

      /* Animated gradient background */
      @keyframes gradient-shift {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }

      .animate-gradient {
        background-size: 200% 200%;
        animation: gradient-shift 8s ease infinite;
      }

      /* Glow effects */
      .glow-cyan {
        box-shadow: 0 0 20px rgba(6, 182, 212, 0.3), 0 0 40px rgba(6, 182, 212, 0.1);
      }

      .glow-purple {
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.3), 0 0 40px rgba(168, 85, 247, 0.1);
      }

      /* Pulse animation */
      @keyframes pulse-glow {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }

      .pulse-glow {
        animation: pulse-glow 2s ease-in-out infinite;
      }

      /* Fade in animation */
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
      }

      /* Glass effect */
      .glass {
        background: rgba(17, 24, 39, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(75, 85, 99, 0.3);
      }

      /* Selection color */
      ::selection {
        background: rgba(6, 182, 212, 0.3);
        color: white;
      }

      /* Loading shimmer */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      .shimmer {
        background: linear-gradient(90deg, transparent, rgba(6, 182, 212, 0.1), transparent);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }

      /* Focus styles */
      *:focus-visible {
        outline: 2px solid #06b6d4;
        outline-offset: 2px;
      }

      /* Smooth transitions globally */
      * {
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
